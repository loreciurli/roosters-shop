<style>
:root{
  --display:"Archivo Black","Inter",system-ui,sans-serif;
  --testo:"Inter",system-ui,-apple-system,sans-serif;
  /* palette ufficiale Roosters */
  --fondo:#171f45;        /* primario */
  --cresta:#951234;       /* secondario bordeaux */
  --oro:#f6a316;          /* secondario oro */

  /* tonalita derivate dal primario, per le superfici */
  --carta:#1f2755;
  --carta-alta:#2a3266;
  --bordo:rgba(244,237,224,.15);
  --oro-chiaro:#ffbc4a;
  --sabbia:#f4ede0;
  --soft:rgba(244,237,224,.6);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--fondo);
  color:var(--sabbia);
  font-family:var(--testo);
  font-weight:300;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}

/* ---------- barra in alto ---------- */

.barra{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(23,31,69,.93);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bordo);
}

.barra .wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding-top:.7rem;
  padding-bottom:.7rem;
}

.marchio{display:flex;align-items:center;gap:.7rem;text-decoration:none;
  color:inherit}

.marchio img{width:2.3rem;height:auto;display:block;
  filter:drop-shadow(0 0 6px rgba(244,237,224,.3))}

.marchio span{font-family:var(--display);font-size:.95rem;
  letter-spacing:-.02em}

.bottone-carrello{
  position:relative;
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:.55rem .95rem;
  border:1px solid var(--bordo);
  border-radius:3px;
  background:transparent;
  color:var(--sabbia);
  font-family:var(--testo);
  font-size:.92rem;
  font-weight:500;
  cursor:pointer;
  transition:border-color .16s ease,background .16s ease;
}

.bottone-carrello:hover{border-color:var(--oro)}

.bottone-carrello.pieno{background:var(--oro);color:#171f45;
  border-color:var(--oro);font-weight:600}

.conta{
  display:none;
  min-width:1.35rem;
  padding:0 .3rem;
  border-radius:1rem;
  background:var(--cresta);
  color:#fff;
  font-size:.76rem;
  font-weight:700;
  line-height:1.35rem;
  text-align:center;
}

.bottone-carrello.pieno .conta{display:inline-block;background:#171f45}

/* ---------- intestazione ---------- */

header.intro{
  padding:2.5rem 0 1.5rem;
  background:linear-gradient(180deg,#222c60,transparent);
}

h1{
  font-family:var(--display);
  font-size:clamp(1.8rem,6vw,2.6rem);
  letter-spacing:-.025em;
  line-height:1.1;
  margin:0 0 .6rem;
}

header.intro p{margin:0;color:var(--soft);max-width:42ch;font-size:1.02rem}

.avviso{
  margin:1.25rem 0 0;
  padding:.9rem 1.1rem;
  border-radius:3px;
  font-size:.95rem;
  display:none;
}
.avviso.ok{background:#1d7a4c;color:#fff;display:block}
.avviso.ko{background:var(--cresta);color:#fff;display:block}

/* ---------- griglia ---------- */

.griglia{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));
  gap:1.1rem;
  padding:1.5rem 0 3rem;
}

.articolo{
  background:var(--carta);
  border:1px solid var(--bordo);
  border-radius:4px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.foto{
  aspect-ratio:1;
  background:var(--carta-alta);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.foto img{width:100%;height:100%;object-fit:cover;display:block}

.foto .vuota{font-family:var(--display);font-size:.8rem;
  color:rgba(244,237,224,.25);letter-spacing:.05em}

.corpo{padding:1rem 1.05rem 1.15rem;display:flex;flex-direction:column;flex:1}

.articolo h2{font-family:var(--display);font-size:1.02rem;
  letter-spacing:-.02em;line-height:1.25;margin:0 0 .3rem}

.desc{font-size:.88rem;color:var(--soft);margin:0 0 .85rem;flex:1}

.prezzo{font-family:var(--display);font-size:1.3rem;color:var(--oro);
  letter-spacing:-.02em;margin:0 0 .85rem}

select{
  width:100%;
  margin-bottom:.65rem;
  padding:.6rem .7rem;
  border-radius:3px;
  border:1px solid var(--bordo);
  background:var(--carta-alta);
  color:var(--sabbia);
  font-family:var(--testo);
  font-size:.95rem;
}

.aggiungi{
  width:100%;
  padding:.75rem;
  border:none;
  border-radius:3px;
  background:var(--oro);
  color:#171f45;
  font-family:var(--display);
  font-size:.9rem;
  letter-spacing:-.01em;
  cursor:pointer;
  transition:background .16s ease;
}
.aggiungi:hover{background:var(--oro-chiaro)}
.aggiungi.fatto{background:#1d7a4c;color:#fff}

/* ---------- pannello carrello ---------- */

.velo{
  position:fixed;
  inset:0;
  background:rgba(8,11,26,.62);
  backdrop-filter:blur(2px);
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease,visibility .2s ease;
  z-index:30;
}
.velo.aperto{opacity:1;visibility:visible}

.pannello{
  position:fixed;
  top:0;right:0;bottom:0;
  width:min(24rem,100%);
  background:var(--carta);
  border-left:1px solid var(--bordo);
  transform:translateX(100%);
  transition:transform .24s ease;
  z-index:31;
  display:flex;
  flex-direction:column;
}
.pannello.aperto{transform:translateX(0)}

.pannello-testa{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.15rem 1.25rem;
  border-bottom:1px solid var(--bordo);
}

.pannello-testa h2{font-family:var(--display);font-size:1.05rem;
  letter-spacing:-.02em;margin:0}

.chiudi{background:none;border:none;color:var(--soft);font-size:1.6rem;
  line-height:1;cursor:pointer;padding:0 .25rem}
.chiudi:hover{color:var(--sabbia)}

.voci{flex:1;overflow:auto;padding:.5rem 1.25rem}

.voce{
  display:flex;
  align-items:center;
  gap:.7rem;
  padding:.8rem 0;
  border-bottom:1px solid var(--bordo);
  font-size:.93rem;
}
.voce .nome{flex:1;line-height:1.4}
.voce .nome b{display:block;font-weight:600;color:var(--oro);font-size:.82rem}
.voce .cifra{white-space:nowrap;font-weight:600}

.voce button{
  background:none;
  border:1px solid var(--bordo);
  color:var(--soft);
  border-radius:3px;
  width:1.8rem;height:1.8rem;
  cursor:pointer;
  font-size:1.05rem;
  line-height:1;
  flex:0 0 auto;
}
.voce button:hover{border-color:var(--cresta);color:var(--sabbia)}

.vuoto{padding:2.5rem .5rem;text-align:center;color:var(--soft);
  font-size:.95rem}

.pannello-fondo{padding:1.25rem;border-top:1px solid var(--bordo)}

.totale{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--display);font-size:1.3rem;letter-spacing:-.02em;
  margin:0 0 .25rem}

.ritiro{margin:0 0 1.1rem;font-size:.85rem;color:var(--soft)}

.paga{
  width:100%;
  padding:.95rem 1.4rem;
  border:none;
  border-radius:3px;
  background:var(--oro);
  color:#171f45;
  font-family:var(--display);
  font-size:1rem;
  letter-spacing:-.01em;
  cursor:pointer;
}
.paga:hover{background:var(--oro-chiaro)}
.paga:disabled{opacity:.55;cursor:wait}

footer{border-top:1px solid var(--bordo);padding:2rem 0 2.5rem;
  color:var(--soft);font-size:.88rem}
footer p{margin:0 0 .45rem;max-width:44ch}

a{color:var(--oro)}
</style>
</head>

<script>
/* =====================================================================
   1. URL DEL BACKEND
   Incolla qui l'URL del deployment Apps Script (finisce con /exec)
   ===================================================================== */

const URL_BACKEND = "https://script.google.com/macros/s/AKfycbz7mnnpc1LproMX96Mz5_1ERPR-jm2mPT2JAhlzwINm2hvPnoy8mcdwBSkboMktFGVX7w/exec";

/* =====================================================================
   2. CATALOGO
   Non scriverlo a mano: lo genera generaCatalogoPerSito() dal foglio.
   Le foto vanno in ./foto/ col nome del codice: foto/borraccia.jpg
   ===================================================================== */

const CATALOGO = [
  { codice: "felpa-1", nome: "Felpa con cappuccio - Year of the Roosters viola",
    descrizione: "", prezzo: 35, taglie: ["S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "felpa-2", nome: "Felpa con cappuccio - Year of the Roosters gialla",
    descrizione: "", prezzo: 35, taglie: ["S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "felpa-3", nome: "Felpa con cappuccio - Roosters melange",
    descrizione: "", prezzo: 35, taglie: ["S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "tshirt-1", nome: "T-shirt - Year of the Roosters melange",
    descrizione: "", prezzo: 15, taglie: ["XS", "S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "tshirt-2", nome: "T-shirt - Year of the Roosters bianca",
    descrizione: "", prezzo: 15, taglie: ["XS", "S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "tshirt-3", nome: "T-shirt - Roosters bordeaux",
    descrizione: "", prezzo: 15, taglie: ["XS", "S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "tshirt-4", nome: "T-shirt - Roosters blu",
    descrizione: "", prezzo: 15, taglie: ["XS", "S", "M", "L", "XL", "2XL", "3XL"] },
  { codice: "cappellino", nome: "Cappellino baseball",
    descrizione: "", prezzo: 10, taglie: [] },
  { codice: "beanie", nome: "Beanie hat",
    descrizione: "", prezzo: 12, taglie: [] },
  { codice: "shopper-bag", nome: "Shopper bag",
    descrizione: "", prezzo: 5, taglie: [] },
  { codice: "portachiavi", nome: "Portachiavi",
    descrizione: "", prezzo: 8, taglie: [] }
];

/* ------------------ da qui in giu non serve toccare ------------------ */

function euro(n) {
  return n.toFixed(2).replace(".", ",") + " \u20ac";
}

let carrello = [];
try {
  carrello = JSON.parse(localStorage.getItem("carrello_roosters") || "[]");
} catch (e) { carrello = []; }

function salva() {
  try {
    localStorage.setItem("carrello_roosters", JSON.stringify(carrello));
  } catch (e) {}
}

/* ---------- vetrina ---------- */

function disegnaVetrina() {
  const g = document.getElementById("griglia");
  g.innerHTML = "";

  CATALOGO.forEach(function (a) {
    const card = document.createElement("div");
    card.className = "articolo";

    const opzioni = a.taglie.length
      ? '<select data-taglia="' + a.codice + '">' +
        a.taglie.map(function (t) {
          return '<option value="' + t + '">Taglia ' + t + '</option>';
        }).join("") + '</select>'
      : '';

    card.innerHTML =
      '<div class="foto">' +
        '<img src="foto/' + a.codice + '.jpg" alt="' + a.nome + '" ' +
        'loading="lazy" decoding="async" width="600" height="600" ' +
        'onerror="this.parentNode.innerHTML=' +
        '&quot;<span class=\'vuota\'>ROOSTERS</span>&quot;">' +
      '</div>' +
      '<div class="corpo">' +
        '<h2>' + a.nome + '</h2>' +
        '<p class="desc">' + (a.descrizione || "") + '</p>' +
        '<p class="prezzo">' + euro(a.prezzo) + '</p>' +
        opzioni +
        '<button class="aggiungi" data-codice="' + a.codice + '">' +
        'Aggiungi</button>' +
      '</div>';

    g.appendChild(card);
  });

  g.querySelectorAll(".aggiungi").forEach(function (b) {
    b.addEventListener("click", function () {
      const sel = g.querySelector('[data-taglia="' + b.dataset.codice + '"]');
      aggiungi(b.dataset.codice, sel ? sel.value : "");
      b.textContent = "Aggiunto";
      b.classList.add("fatto");
      setTimeout(function () {
        b.textContent = "Aggiungi";
        b.classList.remove("fatto");
      }, 1100);
    });
  });
}

/* ---------- carrello ---------- */

function aggiungi(codice, taglia) {
  const esiste = carrello.filter(function (v) {
    return v.codice === codice && v.taglia === taglia;
  })[0];
  if (esiste) esiste.qta++;
  else carrello.push({ codice: codice, taglia: taglia, qta: 1 });
  salva();
  disegnaCarrello();
}

function cambia(i, delta) {
  carrello[i].qta += delta;
  if (carrello[i].qta <= 0) carrello.splice(i, 1);
  salva();
  disegnaCarrello();
}

function disegnaCarrello() {
  const voci = document.getElementById("voci");
  const bot = document.getElementById("apri-carrello");
  voci.innerHTML = "";
  let tot = 0, pezzi = 0;

  if (!carrello.length) {
    voci.innerHTML = '<p class="vuoto">Il carrello e vuoto.</p>';
  }

  carrello.forEach(function (v, i) {
    const a = CATALOGO.filter(function (x) {
      return x.codice === v.codice;
    })[0];
    if (!a) return;
    tot += a.prezzo * v.qta;
    pezzi += v.qta;

    const r = document.createElement("div");
    r.className = "voce";

    const meno = document.createElement("button");
    meno.textContent = "\u2212";
    meno.setAttribute("aria-label", "Togli uno");
    meno.addEventListener("click", function () { cambia(i, -1); });

    const piu = document.createElement("button");
    piu.textContent = "+";
    piu.setAttribute("aria-label", "Aggiungi uno");
    piu.addEventListener("click", function () { cambia(i, 1); });

    const nome = document.createElement("div");
    nome.className = "nome";
    nome.innerHTML = a.nome + (v.taglia ? '<b>Taglia ' + v.taglia + '</b>' : '');

    const cifra = document.createElement("div");
    cifra.className = "cifra";
    cifra.textContent = euro(a.prezzo * v.qta);

    r.appendChild(meno);
    r.appendChild(document.createTextNode(v.qta));
    r.appendChild(piu);
    r.appendChild(nome);
    r.appendChild(cifra);
    voci.appendChild(r);
  });

  document.getElementById("totale").textContent = euro(tot);
  document.getElementById("conta").textContent = pezzi;
  bot.classList.toggle("pieno", pezzi > 0);
  document.getElementById("paga").disabled = !pezzi;
}

/* ---------- apertura e chiusura ---------- */

function apri(si) {
  document.getElementById("pannello").classList.toggle("aperto", si);
  document.getElementById("velo").classList.toggle("aperto", si);
  document.body.style.overflow = si ? "hidden" : "";
}

document.getElementById("apri-carrello")
        .addEventListener("click", function () { apri(true); });
document.getElementById("chiudi")
        .addEventListener("click", function () { apri(false); });
document.getElementById("velo")
        .addEventListener("click", function () { apri(false); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") apri(false);
});

/* ---------- pagamento ---------- */

document.getElementById("paga").addEventListener("click", function () {
  if (!carrello.length) return;
  if (URL_BACKEND.indexOf("http") !== 0) {
    alert("Shop non ancora collegato. Riprova fra poco.");
    return;
  }

  const bottone = this;
  bottone.disabled = true;
  bottone.textContent = "Un attimo\u2026";

  const ordine = carrello.map(function (v) {
    return v.codice + "~" + v.taglia + "~" + v.qta;
  }).join("|");

  // Chiediamo al backend l'indirizzo di pagamento e ci andiamo da soli:
  // niente pagine intermedie di Google, che restano bloccate.
  const nome = "roostersCB" + Date.now();
  let chiuso = false;

  function fallito(messaggio) {
    if (chiuso) return;
    chiuso = true;
    try { delete window[nome]; } catch (e) { window[nome] = undefined; }
    if (tag.parentNode) tag.parentNode.removeChild(tag);
    bottone.disabled = false;
    bottone.textContent = "Vai al pagamento";
    const av = document.getElementById("avviso");
    av.className = "avviso ko";
    av.textContent = messaggio;
    apri(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  window[nome] = function (dati) {
    if (chiuso) return;
    if (dati && dati.url) {
      chiuso = true;
      window.location.href = dati.url;
    } else {
      fallito("Non siamo riusciti ad aprire il pagamento. Riprova, " +
              "oppure scrivici e completiamo l'ordine insieme.");
    }
  };

  const tag = document.createElement("script");
  tag.src = URL_BACKEND + "?callback=" + nome +
            "&ordine=" + encodeURIComponent(ordine);
  tag.onerror = function () {
    fallito("Connessione al pagamento non riuscita. Controlla la rete " +
            "e riprova.");
  };
  document.body.appendChild(tag);

  setTimeout(function () {
    fallito("Il pagamento ci sta mettendo troppo. Riprova fra un minuto.");
  }, 20000);
});

/* ---------- ritorno da Stripe ---------- */

(function () {
  const p = new URLSearchParams(location.search);
  const av = document.getElementById("avviso");

  if (p.get("ok")) {
    carrello = [];
    salva();
    av.className = "avviso ok";
    av.textContent = "Ordine confermato. Ti scriviamo appena e pronto " +
                     "da ritirare in negozio.";
  } else if (p.get("annullato")) {
    av.className = "avviso ko";
    av.textContent = "Pagamento annullato. Il carrello e ancora qui.";
  } else if (p.get("errore")) {
    av.className = "avviso ko";
    av.textContent = "Qualcosa non ha funzionato. Riprova o scrivici.";
  }
  if (p.toString()) history.replaceState({}, "", location.pathname);
})();

disegnaVetrina();
disegnaCarrello();
</script>
